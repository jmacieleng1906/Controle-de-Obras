services:
  obras-app:
    build: .
    image: obras-app:latest
    container_name: obras-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Senha do usuário "admin" criada automaticamente no primeiro uso.
      # Troque aqui ANTES de subir o container pela primeira vez, ou troque
      # pelo próprio app depois de entrar (tela Equipe > Administrador > editar).
      - ADMIN_SENHA_INICIAL=mudar123
    volumes:
      # Guarda o banco de dados fora do container, para não perder os dados
      # ao atualizar/reiniciar o container.
      - ./data:/app/data
